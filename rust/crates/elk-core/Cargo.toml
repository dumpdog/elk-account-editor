[package]
name = "elk-core"
version = "0.1.0"
edition = "2021"
description = "Elk M1G panel protocol: framing, records, handshake, live status, control, modules, backup, clock and log (Rust port of Elk.Protocol)."
publish = false

[dependencies]
aes = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
native-tls = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
rsa = { version = "0.9", features = ["pem"] }

[profile.dev.package.num-bigint-dig]
opt-level = 3

[workspace]
