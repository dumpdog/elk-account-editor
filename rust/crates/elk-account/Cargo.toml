[package]
name = "elk-account"
version = "0.1.0"
edition = "2021"
description = "ElkRP account export file model (port of Elk.Protocol AccountFile/AccountModel/AccountExport/ZoneImport/ZoneSheet/AlarmZoneList)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace]
