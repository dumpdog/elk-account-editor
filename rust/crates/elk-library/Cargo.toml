[package]
name = "elk-library"
version = "0.1.0"
edition = "2021"
description = "Accounts library of the Elk account editor: folders, stored export files (byte exact), version history, settings and the data folder location (SQLite)."
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "7"

[workspace]
